<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordly</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <h2>Wordly</h2>
    <p>Your one page dictionary</p>
  </nav>
  <!-- Search form-->
  <section>
    <form id="form">
      <div class="search">
        <label for="input">Search </label>
        <input type="text" id="input" placeholder="Search..." autocomplete="on">
        <button type="submit">Search</button>
      </div>
      <p id="message">Enter your word to display its meaning</p>
    </form>
  </section>
  <div class="container">
    <!-- Results -->
    <section class="section">
      <h2>Results</h2>
      <div id="results">
        <div>
          <p class="empty">No word entered!!</p>
        </div>
      </div>
    </section>
    <!-- Favorites -->
    <section class="section">
      <h2>Favorites</h2>
      <div id="favorites">
        <p class="empty">No favorite words saved yet</p>
      </div>
    </section>
  </div>
  <script src="./js/index.js" defer></script>
</body>
</html>
