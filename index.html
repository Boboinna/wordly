  <!-- Search form-->
  <section>
    <form id="form">
      <div class="search">
        <label for="input">Search </label>
        <input type="text" id="input" placeholder="Search..." autocomplete="on" />
        <button type="submit">Search</button>
      </div>
      <p id="message">Enter your word to display its meaning</p>
    </form>
  </section>
  <div class="container">
    <!-- Results -->
    <section class="section">
      <h2>Results</h2>
      <div id="results">
        <div>
          <p class="empty">No word entered</p>
        </div>
      </div>
    </section>
    <!-- Favorites -->
    <section class="section">
      <h2>Favorites</h2>
      <div id="favorites">
      </div>
    </section>
  </div>
